name: CI

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main, hardening]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      HASH_KEY: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      SKIP_INTEGRATION: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run npm audit (high and critical vulnerabilities fail)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

  integration-tests:
    name: Real Database Integration Tests
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    if: "${{ secrets.TEST_SUPABASE_URL != '' && secrets.TEST_SUPABASE_PUBLISHABLE_KEY != '' && secrets.TEST_SUPABASE_SECRET_KEY != '' }}"
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      HASH_KEY: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests against Test Database
        run: npm test
